<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seinen - Sekai Anime Clash</title>
  <link rel="stylesheet" href="seinen.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="accueil.html" class="nav-logo">Sekai<span>Clash</span></a>

      <input type="checkbox" id="nav-toggle" class="nav-toggle">
      <label for="nav-toggle" class="nav-hamburger">☰</label>

      <ul class="nav-menu">
        <li><a href="accueil.html">Accueil</a></li>
        <li><a href="page2.html" class="active">Clashs</a></li>
        <li><a href="classement.html">Classement</a></li>
        <li><a href="apropos.html">À propos</a></li>
      </ul>
    </div>
  </nav>

  <main class="container">

    <a href="page2.html" class="back-btn">← Retour aux catégories</a>

    <h1 class="page-title">
      Seinen <span>Clashs</span>
    </h1>

    <p class="page-subtitle">
      Vote pour les meilleurs personnages de l’univers seinen !
    </p>

    <div class="clash-list" id="clash-list"></div>

  </main>

  <script>

    const debates = [

      "Qui est le plus intelligent entre Johan et Light ?",
      "Qui manipule le mieux les gens entre Aizen et Griffith ?",
      "Qui possède le meilleur développement entre Thorfinn et Musashi ?",
      "Qui est le plus terrifiant entre Friend et Makima ?",
      "Qui a vécu le plus de souffrance entre Guts et Kaneki ?",
      "Qui est le meilleur stratège entre Lelouch et Light ?",
      "Qui inspire le plus le respect entre Whitebeard et Askeladd ?",
      "Qui est le plus dangereux mentalement entre Johan et Griffith ?",
      "Qui possède la meilleure philosophie entre Pain et Meruem ?",
      "Qui a le meilleur charisme entre Aizen et Madara ?",
      "Qui est le plus imprévisible entre Hisoka et Sukuna ?",
      "Qui possède la meilleure écriture entre L et Johan ?",
      "Qui domine le mieux son univers entre Saitama et Mob ?",
      "Qui est le plus brisé mentalement entre Eren et Kaneki ?",
      "Qui possède la meilleure évolution entre Shin et Thorfinn ?",
      "Qui est le meilleur anti-héros entre Light et Lelouch ?",
      "Qui est le plus cruel entre Griffith et Makima ?",
      "Qui est le meilleur maître entre Reigen et Gojo ?",
      "Qui possède le meilleur passé entre Guts et Itachi ?",
      "Qui est le plus iconique entre Spike et Vash ?",
      "Qui est le plus fort psychologiquement entre Tenma et Johan ?",
      "Qui possède la meilleure relation rivalité entre L et Light ?",
      "Qui est le plus froid entre Ayanokoji et Johan ?",
      "Qui manipule le mieux la situation entre Aizen et Lelouch ?",
      "Qui est le plus marquant entre Guts et Thorfinn ?",
      "Qui est le meilleur leader entre Erwin et Lelouch ?",
      "Qui a le plus sacrifié pour ses objectifs entre Eren et Light ?",
      "Qui est le plus dangereux en combat entre Garou et Yujiro ?",
      "Qui possède le meilleur mental entre Musashi et Thorfinn ?",
      "Qui est le plus terrifiant en présence entre Sukuna et Madara ?"

    ];

    const list = document.getElementById("clash-list");

    let votes = {};
    let comments = {};
    let userReactions = {};
    let username = sessionStorage.getItem("username") || "";
    let commentIdCounter = 0;

    debates.forEach((debate, index) => {

      const match = debate.match(/entre\s+(.+?)\s+et\s+(.+?)\s*\?/i);

      const fighter1 = match ? match[1].trim() : "Personnage 1";
      const fighter2 = match ? match[2].trim() : "Personnage 2";

      votes[index] = {
        f1True: 0,
        f1False: 0,
        f2True: 0,
        f2False: 0,
        hasVoted: {}
      };

      comments[index] = [];
      userReactions[index] = {};

      list.innerHTML += `

        <div class="clash-card">

          <div class="clash-question">
            <h3>${debate}</h3>
          </div>

          <div class="clash-versus">

            <div class="fighter">

              <h4>${fighter1}</h4>

              <div class="vote-buttons">

                <button class="vote-btn true-btn"
                  onclick="voteFighter(${index}, 1, 'true')">
                  Vrai <span id="f1t-${index}">0</span>
                </button>

                <button class="vote-btn false-btn"
                  onclick="voteFighter(${index}, 1, 'false')">
                  Faux <span id="f1f-${index}">0</span>
                </button>

              </div>

            </div>

            <div class="vs">VS</div>

            <div class="fighter">

              <h4>${fighter2}</h4>

              <div class="vote-buttons">

                <button class="vote-btn true-btn"
                  onclick="voteFighter(${index}, 2, 'true')">
                  Vrai <span id="f2t-${index}">0</span>
                </button>

                <button class="vote-btn false-btn"
                  onclick="voteFighter(${index}, 2, 'false')">
                  Faux <span id="f2f-${index}">0</span>
                </button>

              </div>

            </div>

          </div>

          <div class="comment-section">

            <div class="comment-header-title">
              Débat : ${fighter1} VS ${fighter2}
            </div>

            <div class="username-input">

              <input
                type="text"
                id="username-${index}"
                placeholder="Ton pseudo"
                maxlength="20"
                value="${username}"
              >

              <button
                class="save-name-btn"
                onclick="saveUsername(${index})">
                OK
              </button>

            </div>

            <div class="comment-input">

              <input
                type="text"
                id="comment-${index}"
                placeholder="Donne ton avis..."
                maxlength="200"
              >

              <button
                class="comment-btn"
                onclick="postComment(${index})">
                Envoyer
              </button>

            </div>

            <div class="comments" id="comments-${index}"></div>

          </div>

        </div>

      `;
    });

    function saveUsername(debateId) {

      const input = document.getElementById(`username-${debateId}`);

      username = input.value.trim();

      if (username) {

        sessionStorage.setItem("username", username);

        input.disabled = true;

        document.querySelector(
          `#username-${debateId} + button`
        ).textContent = "✓";
      }
    }

    function voteFighter(debateId, fighter, type) {

      const key =
        `f${fighter}${type.charAt(0).toUpperCase() + type.slice(1)}`;

      if (!votes[debateId].hasVoted) {
        votes[debateId].hasVoted = {};
      }

      if (votes[debateId].hasVoted[fighter] === type) {

        votes[debateId][key]--;

        delete votes[debateId].hasVoted[fighter];

      } else {

        if (votes[debateId].hasVoted[fighter]) {

          const oldType = votes[debateId].hasVoted[fighter];

          const oldKey =
            `f${fighter}${oldType.charAt(0).toUpperCase() + oldType.slice(1)}`;

          votes[debateId][oldKey]--;
        }

        votes[debateId][key]++;

        votes[debateId].hasVoted[fighter] = type;
      }

      document.getElementById(`f1t-${debateId}`).textContent =
        votes[debateId].f1True;

      document.getElementById(`f1f-${debateId}`).textContent =
        votes[debateId].f1False;

      document.getElementById(`f2t-${debateId}`).textContent =
        votes[debateId].f2True;

      document.getElementById(`f2f-${debateId}`).textContent =
        votes[debateId].f2False;
    }

    function postComment(debateId) {

      const input = document.getElementById(`comment-${debateId}`);

      const text = input.value.trim();

      const name =
        username ||
        document.getElementById(`username-${debateId}`).value.trim() ||
        "Anonyme";

      if (!username) {

        username = name;

        sessionStorage.setItem("username", username);
      }

      if (text === "") return;

      const commentId = commentIdCounter++;

      comments[debateId].push({
        id: commentId,
        text: text,
        user: name,
        likes: 0,
        dislikes: 0
      });

      renderComments(debateId);

      input.value = "";
    }

    function renderComments(debateId) {

      const commentsDiv =
        document.getElementById(`comments-${debateId}`);

      commentsDiv.innerHTML = "";

      comments[debateId].forEach(comment => {

        const userReact =
          userReactions[debateId]?.[comment.id];

        commentsDiv.innerHTML += `

          <div class="comment">

            <div class="comment-header">
              <span class="comment-user">${comment.user}</span>
            </div>

            <p>${comment.text}</p>

            <div class="comment-actions">

              <button
                class="like-btn ${userReact === 'like' ? 'active' : ''}"
                onclick="reactComment(${debateId}, ${comment.id}, 'like')">

                👍
                <span id="like-${debateId}-${comment.id}">
                  ${comment.likes}
                </span>

              </button>

              <button
                class="dislike-btn ${userReact === 'dislike' ? 'active' : ''}"
                onclick="reactComment(${debateId}, ${comment.id}, 'dislike')">

                👎
                <span id="dislike-${debateId}-${comment.id}">
                  ${comment.dislikes}
                </span>

              </button>

            </div>

          </div>

        `;
      });
    }

    function reactComment(debateId, commentId, type) {

      const comment =
        comments[debateId].find(c => c.id === commentId);

      if (!comment) return;

      if (!userReactions[debateId]) {
        userReactions[debateId] = {};
      }

      const currentReact =
        userReactions[debateId][commentId];

      if (currentReact === type) {

        if (type === "like") {
          comment.likes--;
        } else {
          comment.dislikes--;
        }

        delete userReactions[debateId][commentId];

      } else {

        if (currentReact === "like") {
          comment.likes--;
        }

        if (currentReact === "dislike") {
          comment.dislikes--;
        }

        if (type === "like") {
          comment.likes++;
        } else {
          comment.dislikes++;
        }

        userReactions[debateId][commentId] = type;
      }

      renderComments(debateId);
    }

  </script>

</body>
</html>
