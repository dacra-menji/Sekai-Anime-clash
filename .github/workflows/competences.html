<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compétences - Sekai Anime Clash</title>
  <link rel="stylesheet" href="competences.css">
</head>

<body>

  <nav class="navbar">
    <div class="nav-container">

      <a href="accueil.html" class="nav-logo">
        Sekai<span>Clash</span>
      </a>

      <input type="checkbox" id="nav-toggle" class="nav-toggle">

      <label for="nav-toggle" class="nav-hamburger">
        ☰
      </label>

      <ul class="nav-menu">
        <li><a href="accueil.html">Accueil</a></li>
        <li><a href="page2.html" class="active">Clashs</a></li>
        <li><a href="classement.html">Classement</a></li>
        <li><a href="apropos.html">À propos</a></li>
      </ul>

    </div>
  </nav>

  <main class="container">

    <a href="page2.html" class="back-btn">
      ← Retour aux catégories
    </a>

    <h1 class="page-title">
      Compétences <span>Clashs</span>
    </h1>

    <p class="page-subtitle">
      Vote pour les pouvoirs les plus cheatés 🔥
    </p>

    <div class="clash-list" id="clash-list"></div>

  </main>

<script>

const debates = [

"Qui possède le pouvoir le plus cheaté entre Gojo et Sukuna ?",
"Quelle technique est la plus dangereuse entre Kamui et Amaterasu ?",
"Qui maîtrise le meilleur haki entre Shanks et Luffy ?",
"Quel pouvoir est le plus destructeur entre Gear 5 et Ultra Instinct ?",
"Qui possède la meilleure régénération entre Ban et Muzan ?",
"Quelle capacité est la plus broken entre Infinity et The Almighty ?",
"Qui possède le meilleur Bankai entre Ichigo et Yamamoto ?",
"Quelle transformation est la plus impressionnante entre Baryon Mode et Ultra Ego ?",
"Qui possède le meilleur domaine entre Gojo et Sukuna ?",
"Quel pouvoir est le plus difficile à contrer entre Kamui et Limitless ?",
"Qui possède la meilleure illusion entre Itachi et Aizen ?",
"Quelle compétence est la plus polyvalente entre Nen et Haki ?",
"Qui maîtrise le mieux le feu entre Ace et Yamamoto ?",
"Quelle capacité est la plus terrifiante entre Death Note et Geass ?",
"Qui possède la meilleure vitesse entre Minato et Flashy Flash ?",
"Quel pouvoir est le plus stylé entre Susanoo et Stand ?",
"Qui possède le meilleur potentiel entre Deku et Yuji ?",
"Quelle technique est la plus iconique entre Rasengan et Kamehameha ?",
"Qui maîtrise le mieux l’électricité entre Killua et Enel ?",
"Quelle compétence est la plus utile entre Sharingan et Byakugan ?",
"Qui possède le meilleur éveil entre Luffy et Law ?",
"Quel pouvoir est le plus imprévisible entre Gear 5 et Bungee Gum ?",
"Qui possède la meilleure endurance entre Zoro et Guts ?",
"Quelle technique est la plus meurtrière entre Hollow Purple et Genkidama ?",
"Qui possède le meilleur contrôle du temps entre Dio et Hit ?",
"Quel pouvoir est le plus équilibré entre Nen et Chakra ?",
"Qui possède la meilleure défense entre Gaara et Bartolomeo ?",
"Quelle transformation est la plus stylée entre Super Saiyan Blue et Gear 5 ?",
"Qui maîtrise le mieux les ombres entre Megumi et Tokoyami ?",
"Quel personnage possède la meilleure aura entre Madara et Sukuna ?",
"Qui possède la meilleure intelligence de combat entre Aizen et Madara ?",
"Quelle compétence est la plus sous-estimée entre Smoker et Crocodile ?",
"Qui possède la meilleure précision entre Yasopp et Van Augur ?",
"Quel pouvoir est le plus effrayant entre Idle Transfiguration et Decay ?",
"Qui maîtrise le mieux les ténèbres entre Yami et Blackbeard ?",
"Quelle technique est la plus rapide entre Flying Raijin et Sonido ?",
"Qui possède la meilleure fusion entre Gogeta et Vegito ?",
"Quel personnage possède le meilleur contrôle mental entre Makima et Aizen ?",
"Qui possède la meilleure force brute entre Escanor et Whitebeard ?",
"Quelle compétence est la plus rare entre Conqueror Haki et Rinnegan ?",
"Qui possède le meilleur pouvoir démoniaque entre Asta et Meliodas ?",
"Quelle capacité est la plus impressionnante entre Domain Expansion et Bankai ?",
"Qui maîtrise le mieux les armes entre Erza et Gilgamesh ?",
"Quel pouvoir est le plus injuste entre Saitama et Anos ?",
"Qui possède le meilleur pouvoir divin entre Beerus et Zeno ?",
"Quelle compétence est la plus dangereuse entre Tsukuyomi et Kyoka Suigetsu ?",
"Qui possède le meilleur pouvoir de destruction entre Broly et Kaido ?",
"Quel personnage possède la meilleure maîtrise magique entre Julius et Merlin ?",
"Qui possède le meilleur potentiel d’évolution entre Naruto et Luffy ?",
"Quelle capacité est la plus impressionnante entre Susanoo et Perfect Cell ?"

];

const list = document.getElementById("clash-list");

let votes = {};
let comments = {};
let userReactions = {};
let username = sessionStorage.getItem("username") || "";
let commentIdCounter = 0;

debates.forEach((debate, index) => {

  const parts = debate.match(/entre\s+(.+?)\s+et\s+(.+?)\?/);

  const fighter1 = parts ? parts[1].trim() : "Perso 1";
  const fighter2 = parts ? parts[2].trim() : "Perso 2";

  votes[index] = {
    f1True: 0,
    f1False: 0,
    f2True: 0,
    f2False: 0,
    hasVoted: {}
  };

  comments[index] = [];
  userReactions[index] = {};

  list.innerHTML += `

  <div class="clash-card">

    <div class="clash-question">
      <h3>${debate}</h3>
    </div>

    <div class="clash-versus">

      <div class="fighter">

        <h4>${fighter1}</h4>

        <div class="vote-buttons">

          <button class="vote-btn true-btn"
          onclick="voteFighter(${index},1,'true')">

          Vrai
          <span id="f1t-${index}">0</span>

          </button>

          <button class="vote-btn false-btn"
          onclick="voteFighter(${index},1,'false')">

          Faux
          <span id="f1f-${index}">0</span>

          </button>

        </div>

      </div>

      <div class="vs">VS</div>

      <div class="fighter">

        <h4>${fighter2}</h4>

        <div class="vote-buttons">

          <button class="vote-btn true-btn"
          onclick="voteFighter(${index},2,'true')">

          Vrai
          <span id="f2t-${index}">0</span>

          </button>

          <button class="vote-btn false-btn"
          onclick="voteFighter(${index},2,'false')">

          Faux
          <span id="f2f-${index}">0</span>

          </button>

        </div>

      </div>

    </div>

    <div class="comment-section">

      <div class="comment-header-title">
        Débat : ${fighter1} vs ${fighter2}
      </div>

      <div class="username-input">

        <input type="text"
        id="username-${index}"
        placeholder="Ton pseudo"
        maxlength="20"
        value="${username}">

        <button class="save-name-btn"
        onclick="saveUsername(${index})">

        OK

        </button>

      </div>

      <div class="comment-input">

        <input type="text"
        id="comment-${index}"
        placeholder="Argumente ton choix..."
        maxlength="200">

        <button class="comment-btn"
        onclick="postComment(${index})">

        Envoyer

        </button>

      </div>

      <div class="comments"
      id="comments-${index}"></div>

    </div>

  </div>

  `;

});

function saveUsername(debateId){

  const input =
  document.getElementById(`username-${debateId}`);

  username = input.value.trim();

  if(username){

    sessionStorage.setItem("username", username);

    input.disabled = true;

    document.querySelector(
      `#username-${debateId} + button`
    ).textContent = "✓";
  }
}

function voteFighter(debateId, fighter, type){

  const key =
  `f${fighter}${type.charAt(0).toUpperCase() + type.slice(1)}`;

  if(!votes[debateId].hasVoted){
    votes[debateId].hasVoted = {};
  }

  if(votes[debateId].hasVoted[fighter] === type){

    votes[debateId][key]--;

    delete votes[debateId].hasVoted[fighter];

  }else{

    if(votes[debateId].hasVoted[fighter]){

      const oldType =
      votes[debateId].hasVoted[fighter];

      const oldKey =
      `f${fighter}${oldType.charAt(0).toUpperCase() + oldType.slice(1)}`;

      votes[debateId][oldKey]--;
    }

    votes[debateId][key]++;

    votes[debateId].hasVoted[fighter] = type;
  }

  document.getElementById(`f1t-${debateId}`).textContent =
  votes[debateId].f1True;

  document.getElementById(`f1f-${debateId}`).textContent =
  votes[debateId].f1False;

  document.getElementById(`f2t-${debateId}`).textContent =
  votes[debateId].f2True;

  document.getElementById(`f2f-${debateId}`).textContent =
  votes[debateId].f2False;
}

function postComment(debateId){

  const input =
  document.getElementById(`comment-${debateId}`);

  const text = input.value.trim();

  const name =
  username ||
  document.getElementById(`username-${debateId}`).value.trim() ||
  "Anonyme";

  if(!username){

    username = name;

    sessionStorage.setItem("username", username);
  }

  if(text === "") return;

  const commentId = commentIdCounter++;

  comments[debateId].push({
    id: commentId,
    text: text,
    user: name,
    likes: 0,
    dislikes: 0
  });

  renderComments(debateId);

  input.value = "";
}

function renderComments(debateId){

  const commentsDiv =
  document.getElementById(`comments-${debateId}`);

  commentsDiv.innerHTML = "";

  comments[debateId].forEach(comment => {

    const userReact =
    userReactions[debateId]?.[comment.id];

    commentsDiv.innerHTML += `

    <div class="comment">

      <div class="comment-header">

        <span class="comment-user">
          ${comment.user}
        </span>

      </div>

      <p>${comment.text}</p>

      <div class="comment-actions">

        <button class="like-btn
        ${userReact === 'like' ? 'active' : ''}"

        onclick="reactComment(${debateId},
        ${comment.id},
        'like')">

        👍
        <span>
          ${comment.likes}
        </span>

        </button>

        <button class="dislike-btn
        ${userReact === 'dislike' ? 'active' : ''}"

        onclick="reactComment(${debateId},
        ${comment.id},
        'dislike')">

        👎
        <span>
          ${comment.dislikes}
        </span>

        </button>

      </div>

    </div>

    `;
  });
}

function reactComment(debateId, commentId, type){

  const comment =
  comments[debateId].find(c => c.id === commentId);

  if(!comment) return;

  if(!userReactions[debateId]){
    userReactions[debateId] = {};
  }

  const currentReact =
  userReactions[debateId][commentId];

  if(currentReact === type){

    if(type === "like"){
      comment.likes--;
    }else{
      comment.dislikes--;
    }

    delete userReactions[debateId][commentId];

  }else{

    if(currentReact === "like"){
      comment.likes--;
    }

    if(currentReact === "dislike"){
      comment.dislikes--;
    }

    if(type === "like"){
      comment.likes++;
    }else{
      comment.dislikes++;
    }

    userReactions[debateId][commentId] = type;
  }

  renderComments(debateId);
}

</script>

</body>
</html>
